# yaml-language-server: $schema=https://raw.githubusercontent.com/helm-unittest/helm-unittest/main/schema/helm-testsuite.json
suite: Routes - Outbound SSO ServiceEntry
templates:
  - templates/bigbang/routes.yaml
release:
  name: mattermost
  namespace: mattermost
capabilities:
  apiVersions:
    - networking.istio.io/v1
tests:
  - it: should create SSO ServiceEntry when enabled
    set:
      routes:
        outbound:
          sso:
            enabled: true
      sso:
        auth_endpoint: https://login.dso.mil/auth/realms/baby-yoda/protocol/openid-connect/auth
    asserts:
      - containsDocument:
          kind: ServiceEntry
          apiVersion: networking.istio.io/v1
          name: sso-external
          any: true

  - it: should have correct SSO host from auth_endpoint
    set:
      routes:
        outbound:
          sso:
            enabled: true
      sso:
        auth_endpoint: https://login.dso.mil/auth/realms/baby-yoda/protocol/openid-connect/auth
    documentSelector:
      path: metadata.name
      value: sso-external
    asserts:
      - equal:
          path: spec.hosts[0]
          value: login.dso.mil

  - it: should have correct port configuration for TLS
    set:
      routes:
        outbound:
          sso:
            enabled: true
      sso:
        auth_endpoint: https://login.dso.mil/auth/realms/baby-yoda/protocol/openid-connect/auth
    documentSelector:
      path: metadata.name
      value: sso-external
    asserts:
      - equal:
          path: spec.ports[0].number
          value: 443
      - equal:
          path: spec.ports[0].name
          value: https
      - equal:
          path: spec.ports[0].protocol
          value: TLS

  - it: should have MESH_EXTERNAL location
    set:
      routes:
        outbound:
          sso:
            enabled: true
      sso:
        auth_endpoint: https://login.dso.mil/auth/realms/baby-yoda/protocol/openid-connect/auth
    documentSelector:
      path: metadata.name
      value: sso-external
    asserts:
      - equal:
          path: spec.location
          value: MESH_EXTERNAL

  - it: should not create SSO ServiceEntry when disabled
    set:
      routes:
        outbound:
          sso:
            enabled: false
      sso:
        auth_endpoint: https://login.dso.mil/auth/realms/baby-yoda/protocol/openid-connect/auth
    asserts:
      - not: true
        containsDocument:
          kind: ServiceEntry
          apiVersion: networking.istio.io/v1
          name: sso-external
          any: true

  - it: should work with different SSO providers
    set:
      routes:
        outbound:
          sso:
            enabled: true
      sso:
        auth_endpoint: https://keycloak.bigbang.dev/auth/realms/test/protocol/openid-connect/auth
    documentSelector:
      path: metadata.name
      value: sso-external
    asserts:
      - equal:
          path: spec.hosts[0]
          value: keycloak.bigbang.dev
